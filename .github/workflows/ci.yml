name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phonbot_usage_test
          POSTGRES_DB: phonbot_usage_test
          # Disposable local service only; never a deployment credential.
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phonbot_usage_test -d phonbot_usage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test secret check and scan tracked files
        run: node --test scripts/check-secrets.test.mjs && node scripts/check-secrets.mjs

      - name: Build Shared and Voice Core
        run: pnpm --filter @vas/shared --filter @vas/voice-core build

      - name: Build API (includes TypeScript checks)
        run: pnpm --filter @vas/api build

      - name: Typecheck Web
        run: pnpm --filter @vas/web typecheck

      - name: Check Supabase migrations and static Own-KB readiness
        run: pnpm supabase:migrations:check

      - name: Test all workspace packages
        run: pnpm -r --workspace-concurrency=1 run test --run

      - name: Test usage reservations against isolated PostgreSQL
        env:
          USAGE_TEST_DATABASE: phonbot_usage_test
          USAGE_TEST_DATABASE_PASSWORD: local-test-only
          USAGE_TEST_DATABASE_PORT: 5432
        run: pnpm --filter @vas/api test:integration

      - name: Generate SEO pages
        run: pnpm seo:generate

      - name: Verify generated SEO artifacts are committed
        run: git diff --exit-code -- apps/web/public

      - name: Build Web
        run: pnpm --filter @vas/web build

      - name: Audit SEO artifact
        run: pnpm seo:audit
